[package]
name = "cdcell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CDC from celld Durable Objects to append-only Iceberg change logs."

[dependencies]
cdcell-core = { path = "../cdcell-core" }
iceberg = "=0.10.1"
iceberg-catalog-rest = "=0.10.1"
iceberg-storage-opendal = { version = "=0.10.1", features = ["opendal-s3"] }
arrow-array = "58"
arrow-schema = "58"
arrow-buffer = "58"
parquet = "58"
async-nats = "=0.50.0"
object_store = { version = "0.12", default-features = false, features = ["aws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
percent-encoding = "2"
sha2 = "0.10"
bytes = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
